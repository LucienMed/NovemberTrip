:root{color-scheme:light dark;

*{box-sizing:border-box;min-width:0}

 $('strip').classList.toggle('hide',view!=='day');
 $('view').innerHTML=view==='tix'?tix():view==='list'?`<div class="list">${list()}</div>`:grid(view==='week'?[0,1,2,3,4]:[cur]);
 if(view!=='list'){const sc=document.querySelector('.gridw');if(sc&&!rView.did){rView.did=1}}}
function rSide(){
 let h=['一','二','三','四','五','六','日'].map(x=>`<span class="h">${x}</span>`).join('')+'<span></span>';const t=today();
 for(let d=1;d<=31;d++){const inT=d>=14&&d<=18,isT=t.y===2026&&t.mo===11&&t.d===d;h+=`<span class="${inT?'t':'o'}${inT&&view==='day'&&d-14===cur?' cur':''}${isT?' td':''}"${inT?` data-cur="${d-14}" role="button" tabindex="0"`:''}>${d}</span>`}
 $('mm').innerHTML=h;
 const dec=SLOTS.map(leader),n=dec.filter(Boolean).length;
 $('pf').innerHTML=FAM.map(k=>{const hit=dec.filter(o=>o&&o.w.includes(k)).length;return `<button data-f="${k}" aria-pressed="${filt.includes(k)}" style="color:${P[k].c}"><span class="cb"></span><span style="color:var(--ink)">${P[k].n}</span><small>${n?Math.round(hit/n*100)+'%':'－'}</small></button>`}).join('');
 const eff=dec.reduce((a,o)=>a+(o?o.e:0),0),mx=dec.reduce((a,o)=>a+(o?3:0),0),ti=mx?Math.round(eff/mx*100):0;
 {let nn=0,dn=0;DAYS.forEach((d,di)=>d.items.forEach((it,k)=>{let key=null;if(!it.id&&it.tk)key='tk:f'+di+'-'+k;else if(it.id){const L=leader(it);if(L&&L.tk&&L.tk!=='F')key='tk:'+it.id+':'+it.o.indexOf(L)}if(key){nn++;if(S.done[key])dn++}}));$('tixs').textContent=`而家要訂 ${nn} 樣，已訂 ${dn} 樣。`}
 $('tired').textContent=n?`媽咪攰度 ${ti}%${ti>55?'，要加休息！':''}${dec.some(o=>o&&o.ic==='chips')?'':'；爸爸未有賭場！'}`:'未有人投票'}
function rMe(){$('mea').textContent=me?P[me].n[0]:'?';$('mea').style.background=me?P[me].c:'var(--k-gray)';$('men').textContent=me?P[me].n:'揀你係邊個'}
function links(o){let h='';if(o.u)h+=`<a class="lk" href="${o.u}" target="_blank" rel="noopener">官網／預訂 ↗</a>`;if(o.m)h+=`<a class="lk" href="${MAP(o.m)}" target="_blank" rel="noopener">地圖 ↗</a>`;return h}
function findEv(key){if(key[0]==='c'){const c=S.custom.find(x=>'c'+x.id===key);if(!c)return null;const di=c.d-14;return evOf(di).find(e=>e.key===key)}const di=+key.split('-')[0];return evOf(di).find(e=>e.key===key)}
function rSheet(){
 const pan=$('pan');if(openKey===null){$('sheet').classList.add('hide');return}
 if(openKey==='me'){pan.innerHTML=`<div class="ph" style="background:var(--ink);color:var(--bg)"><h2 id="sht">你係邊位？</h2><p>揀咗先可以投票、新增活動、上載相片</p><button class="x" data-close aria-label="關閉">×</button></div><div class="pb"><div class="who">${Object.keys(P).map(k=>`<button class="chip" data-me="${k}" aria-pressed="${me===k}"><span class="av" style="background:${P[k].c}">${P[k].n[0]}</span>${P[k].n}<small>${P[k].t}</small></button>`).join('')}</div></div>`}
 else if(String(openKey).startsWith('x')){const e=EVS[+openKey.slice(1)];pan.innerHTML=`<div class="ph" style="background:${col(e.ic)}"><h2 id="sht">${e.n}</h2><p>${e.w}</p><button class="x" data-close aria-label="關閉">×</button></div><div class="pb"><p class="d">${e.d}</p><div class="acts"><a class="lk" href="${e.u}" target="_blank" rel="noopener">詳情 ↗</a></div></div>`}
 else{const e=findEv(openKey);if(!e){openKey=null;rSheet();return}const di=e.cus?e.cus.d-14:+openKey.split('-')[0],d=DAYS[di];
  let body='';
  if(e.slot){const v=S.votes[e.slot.id]||{};body=`<p class="d">${esc(e.slot.q)} 撳「投呢個」，再撳一次取消。</p>`+e.slot.o.map((o,i)=>{const vs=(v[i]||[]).filter(x=>P[x]),mine=me&&vs.includes(me);
   return `<div class="op${e.L===o?' win':''}${mine?' mine':''}"><div class="ophd"><i style="background:${col(o.ic)}"></i><b>${o.n}</b>${o.tk?`<span class="tg ${o.tk}">${TKL[o.tk]}</span>`:''}</div><span class="d">${o.d}</span><span class="dots">${o.w.split('').map(k=>`<span class="dot" style="background:${P[k].c}"></span>`).join('')} 啱${o.w.split('').map(k=>P[k].n).join('、')}</span>${vs.length?`<span class="vs">${vs.map(x=>`<span class="v" style="background:${P[x].c}">${P[x].n}</span>`).join('')}</span>`:''}<div class="acts">${links(o)}<button class="vote" data-s="${e.slot.id}" data-i="${i}">${mine?'已投 ✓':'投呢個'}</button></div></div>`}).join('')}
  else if(e.cus){body=`<p class="d">${esc(P[e.cus.w]?P[e.cus.w].n:'')} 新增嘅活動</p><div class="acts"><a class="lk" href="${MAP(e.cus.t+' Gold Coast')}" target="_blank" rel="noopener">地圖 ↗</a>${me===e.cus.w||me==='l'?`<button class="btn g" data-del="${e.cus.id}">刪除</button>`:''}</div>`}
  else body=`<p class="d">${esc(e.sub)}</p>`;
  pan.innerHTML=`<div class="ph" style="background:${ecol(e)}"><h2 id="sht">${esc(e.ttl)}</h2><p>12月${d.dd}日 星期${d.wd} · ${rng(e.a,e.b)}</p><button class="x" data-close aria-label="關閉">×</button></div><div class="pb">${body}</div>`}
 $('sheet').classList.remove('hide')}
function ck(arr,el){$(el).innerHTML=arr.map(a=>{const by=S.done[a[0]];return `<button class="ck${by?' on':''}" data-ck="${a[0]}"><span class="bx"></span><span class="tx">${a[1]}<small>${a[2]||''}${by&&P[by]?(a[2]?' · ':'')+P[by].n+' 剔咗':''}</small></span></button>`}).join('')}
function rNotes(){$('notes').innerHTML=S.notes.slice(-40).reverse().map(n=>`<li><b style="color:${P[n.w]?P[n.w].c:'inherit'}">${esc(P[n.w]?P[n.w].n:'?')}</b>：${esc(n.x)}</li>`).join('')||'<li style="color:var(--mute)">未有留言</li>'}
function rPhotos(){$('up').classList.toggle('hide',!DB||ro);
 $('phs').innerHTML=S.photos.length?S.photos.slice().reverse().map(p=>`<figure><img loading="lazy" alt="${esc((P[p.w]?P[p.w].n:'')+' 上載嘅相')}" src="${p.path&&DB?esc(PHOTO(p.path)):''}"><figcaption>${esc(P[p.w]?P[p.w].n:'')}</figcaption></figure>`).join(''):`<div class="empty" style="grid-column:1/-1">${DB?'未有相片，旅行時記得上載！':'未連接數據庫，暫時上載唔到相。'}</div>`}
function all(){rMe();rSide();rView();ck(BOOK,'book');ck(PACK,'pack');rNotes();rPhotos();if(openKey!==null)rSheet();
 $('ro').innerHTML=!DB?'<div class="banner">示範模式：未連接數據庫，改動只會儲存喺呢部機。設定方法睇 README。</div>':ro?'<div class="banner">連唔到數據庫，請檢查網絡；可以用最底「複製結果去 WhatsApp」send 畀 Leo。</div>':''}
const api=(p,o={})=>fetch(CFG.url.replace(/\/$/,'')+p,{...o,headers:{...HDR,...(o.headers||{})}});
async function pull(){if(!DB||busyC)return;try{const r=await api('/rest/v1/trip?id=eq.'+encodeURIComponent(ROW)+'&select=state,ver');if(!r.ok)throw 0;const a=await r.json();if(!a[0])throw 0;if(a[0].ver!==ver){ver=a[0].ver;S=norm(a[0].state);all()}ro=false}catch(e){if(ver<0){ro=true;all()}}}
async function act(fn,msg){
 fn(S);all();
 if(!DB){try{localStorage.setItem('o-state',JSON.stringify(S))}catch(e){}if(msg)flash(msg);return}
 busyC=true;flash('儲存中…');
 try{for(let i=0;i<5;i++){
  const r=await api('/rest/v1/trip?id=eq.'+encodeURIComponent(ROW)+'&select=state,ver');const a=await r.json();const cur=norm(a[0].state),v=a[0].ver;fn(cur);
  const u=await api('/rest/v1/trip?id=eq.'+encodeURIComponent(ROW)+'&ver=eq.'+v,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({state:cur,ver:v+1,updated_at:new Date().toISOString()})});
  if(!u.ok)throw new Error('http '+u.status);const got=await u.json();
  if(got.length){S=cur;ver=v+1;busyC=false;all();flash(msg||'已儲存');return}}
  throw new Error('conflict')}
 catch(e){busyC=false;flash('未能儲存，請再試');await pull()}busyC=false}
function need(){if(me)return true;openKey='me';rSheet();flash('請先揀你係邊位');return false}
function parse(s){
 let t=s.trim(),d=null,a=null,b=null;
 const md=t.match(/(?:12月)?\s*(1[4-8])\s*(?:號|日|\/12)/);if(md){d=+md[1];t=t.replace(md[0],' ')}
 let pm=/下午|晚上|夜晚|pm/i.test(t),am=/上午|朝早|早上|am/i.test(t);
 const mt=t.match(/(\d{1,2})(?:[:：](\d{2})|點(半)?|(?=\s*[ap]m))(?:\s*(?:-|–|至|到)\s*(\d{1,2})(?:[:：](\d{2})|點(半)?)?)?/);
 if(mt){a=+mt[1]+(mt[2]?+mt[2]/60:mt[3]?.5:0);if(mt[4])b=+mt[4]+(mt[5]?+mt[5]/60:mt[6]?.5:0);t=t.replace(mt[0],' ')}
 if(a!==null&&a<12&&(pm||(!am&&a<7)))a+=12;if(b!==null&&b<12&&(b<a||pm))b+=12;
 t=t.replace(/下午|晚上|夜晚|上午|朝早|早上|\bpm\b|\bam\b/ig,' ').replace(/\s+/g,' ').trim();
 if(d===null)d=DAYS[cur].dd;if(a===null)a=12;a=Math.max(H0,Math.min(22.5,a));if(b===null||b<=a)b=Math.min(H1,a+1.5);
 return{d,a,b,t:t.slice(0,40)}}
$('qi').addEventListener('input',()=>{const v=$('qi').value;if(!v.trim()){$('pv').textContent='';return}const p=parse(v);$('pv').textContent=`12月${p.d}日 ${rng(p.a,p.b)} ${p.t||'（未有名）'}`});
$('qa').addEventListener('submit',e=>{e.preventDefault();if(!need())return;const p=parse($('qi').value);if(!p.t){flash('請寫埋做咩');return}
 const item={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),w:me,...p};$('qi').value='';$('pv').textContent='';cur=p.d-14;act(x=>{if(!x.custom.some(c=>c.id===item.id))x.custom.push(item)},'已加入 12月'+p.d+'日')});
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.closest('[data-close]')||t.id==='sheet'){openKey=null;rSheet();return}
 const vw=t.closest('[data-view]');if(vw){view=vw.dataset.view;try{localStorage.setItem('o-view',view)}catch(x){}all();return}
 const cu=t.closest('[data-cur]');if(cu){cur=+cu.dataset.cur;if(view==='week'&&innerWidth<760)view='day';if(view==='list')view='day';all();return}
 const f=t.closest('[data-f]');if(f){const k=f.dataset.f;filt=filt.includes(k)?filt.filter(x=>x!==k):[...filt,k];try{localStorage.setItem('o-filt',JSON.stringify(filt))}catch(x){}all();return}
 if(t.closest('#meb')){openKey='me';rSheet();return}
 const c=t.closest('[data-me]');if(c){me=c.dataset.me;try{localStorage.setItem('o-me',me)}catch(x){}openKey=null;all();rSheet();flash('你好，'+P[me].n+'！');return}
 const ev=t.closest('[data-ev]');if(ev){openKey=ev.dataset.ev;rSheet();return}
 const xe=t.closest('[data-xe]');if(xe){openKey='x'+xe.dataset.xe;rSheet();return}
 const o=t.closest('.vote');if(o){if(!need())return;const s=o.dataset.s,i=+o.dataset.i,had=((S.votes[s]||{})[i]||[]).includes(me),who=me;
  act(x=>{const v=x.votes[s]=x.votes[s]||{};Object.keys(v).forEach(k=>v[k]=(v[k]||[]).filter(y=>y!==who));if(!had)(v[i]=v[i]||[]).push(who)});return}
 const dl=t.closest('[data-del]');if(dl){const id=dl.dataset.del;openKey=null;rSheet();act(x=>{x.custom=x.custom.filter(c=>c.id!==id)},'已刪除');return}
 const k=t.closest('[data-ck]');if(k){if(!need())return;const id=k.dataset.ck,on=!!S.done[id],who=me;act(x=>{if(on)delete x.done[id];else x.done[id]=who});return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openKey!==null){openKey=null;rSheet()}if(e.key==='Enter'&&e.target.matches('.mm [data-cur]')){e.target.click()}});
$('nf').addEventListener('submit',e=>{e.preventDefault();if(!need())return;const t=$('nt').value.trim();if(!t)return;const n={w:me,x:t.slice(0,200),id:Date.now().toString(36)};$('nt').value='';act(x=>{if(!x.notes.some(y=>y.id===n.id))x.notes.push(n);if(x.notes.length>60)x.notes=x.notes.slice(-60)},'已貼出')});
async function shrink(f){try{const b=await createImageBitmap(f),k=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(x=>r(x||f),'image/jpeg',.82))}catch(e){return f}}
$('file').addEventListener('change',async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length||!need()||!DB)return;flash('上載緊 '+fs.length+' 張…');const add=[];
 for(const f of fs){try{const b=await shrink(f),ext=b.type==='image/jpeg'?'jpg':(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''),path=ROW+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.'+ext;
  const r=await api('/storage/v1/object/photos/'+path,{method:'POST',headers:{'Content-Type':b.type||'application/octet-stream'},body:b});if(!r.ok)throw 0;add.push({path,w:me})}catch(x){flash('有相上載唔到')}}
 if(add.length)act(x=>{x.photos.push(...add.filter(a=>!x.photos.some(p=>p.path===a.path)));if(x.photos.length>200)x.photos=x.photos.slice(-200)},'上載咗 '+add.length+' 張')});
$('copy').addEventListener('click',async()=>{const L=['【O家黃金海岸畢業遊 投票結果】'];
 DAYS.forEach(d=>d.items.forEach(it=>{if(!it.id)return;const v=S.votes[it.id]||{},ld=leader(it);L.push(`${d.dd}/12 ${hm(it.a)}：${ld?ld.n:'未決定'}`+(me?`（我揀：${(it.o.find((o,i)=>(v[i]||[]).includes(me))||{n:'未揀'}).n}）`:''))}));
 S.custom.forEach(c=>L.push(`${c.d}/12 ${hm(c.a)}：${c.t}（新增）`));if(me)L.push('by '+P[me].n);const txt=L.join('\n');
 try{await navigator.clipboard.writeText(txt);flash('已複製，貼去 WhatsApp 就得')}catch(x){$('copyout').innerHTML='<textarea readonly aria-label="結果"></textarea>';$('copyout').firstChild.value=txt;$('copyout').firstChild.select();flash('請長按複製')}});
$('tips').innerHTML=TIPS.map(t=>`<li><b>${t[0]}</b>${t[1]}</li>`).join('');
all();
if(DB){pull();setInterval(()=>{if(!document.hidden)pull()},8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}
}
</script>
</body>
